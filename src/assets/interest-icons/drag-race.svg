                    <text id="location">
                        <tspan x="21" y="31" fill="#4A4A4A">Working with like minded individuals to create a safe and inclusive </tspan>
                        <tspan x="21" y="41" fill="#4A4A4A">environment to work in. Create events to educate, celebrate, and </tspan>
                        <tspan x="21" y="51" fill="#4A4A4A">create understanding around LGBT+ community.</tspan>
